name: Deploy Docs Site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'AyobamiH/openclaw-operator'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run canonical protected-branch verification
        run: npm run verify:main

      - name: Write source-bound public release receipt
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: node scripts/write-pages-release-receipt.mjs site/.vitepress/dist

      - name: Verify release receipt safety
        run: node --test scripts/write-pages-release-receipt.test.mjs

      - name: Verify exact production deployment proof (offline mocks only)
        run: node --test scripts/record-pages-production-deployment.test.mjs

      - name: Upload private docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: private-docs-site
          path: site/.vitepress/dist

      - name: Setup Pages
        if: vars.ENABLE_GITHUB_PAGES == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: vars.ENABLE_GITHUB_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

      - name: Explain docs publish mode
        run: |
          if [ "${{ vars.ENABLE_GITHUB_PAGES }}" = "true" ]; then
            echo "GitHub Pages deploy is enabled for this repo." >> "$GITHUB_STEP_SUMMARY"
            echo "Docs were uploaded as both a Pages artifact and a private build artifact." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "GitHub Pages deploy is disabled for this repo." >> "$GITHUB_STEP_SUMMARY"
            echo "Docs were built and uploaded as the private-docs-site artifact so the private repo stays in sync without failing on unsupported Pages hosting." >> "$GITHUB_STEP_SUMMARY"
            echo "If this repo moves to a plan that supports private Pages, enable Pages in repo settings and set the ENABLE_GITHUB_PAGES repository variable to true." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    if: github.repository == 'AyobamiH/openclaw-operator' && github.ref == 'refs/heads/main' && vars.ENABLE_GITHUB_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      deployments: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record new authenticated production deployment proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/record-pages-production-deployment.mjs
